<!--
🎓 iBall Educational Project (Frontend)

📌 PURPOSE:
This file contains the structure of the website.
It defines what elements appear on the page.

⚠️ IMPORTANT:
- Do NOT write styling here (use CSS file)
- Do NOT write logic here (use JS file)
- Only structure HTML elements here
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>iBall Educational Website</title>

    <!-- Linking external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- 🔥 Intro Section (Loading Screen) -->
<!-- This is shown first when website opens -->
<div id="intro">
    <h1>Welcome to iBall</h1>
</div>

<!-- 🌐 Main Website Content -->
<!-- Hidden initially, shown after intro animation -->
<main id="main-content">

    <!-- 🧭 HEADER SECTION -->
    <!-- Contains logo and navigation -->
    <header>
        <h2>iBall</h2>

        <nav>
            <!-- Navigation links (can be expanded later) -->
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">Cart</a>
        </nav>
    </header>

    <!-- 🛍️ PRODUCT SECTION -->
    <!-- Products will be added dynamically using JavaScript -->
    <section>
        <h2>Featured Products</h2>

        <!-- This is where JS will inject product cards -->
        <div id="productGrid"></div>

        <!-- Cart counter -->
        <p>Cart Items: <span id="cartCount">0</span></p>
    </section>

</main>

<!-- Linking external JavaScript file -->
<script src="script.js"></script>

</body>
</html>
