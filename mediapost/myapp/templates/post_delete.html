{% extends "layout.html" %}

{% block title %}Delete the Post{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="auth-card p-4 p-lg-5 text-center">
                <h1 class="fw-bold mb-3">Delete this post?</h1>
                <p class="text-muted mb-4">This action cannot be undone. Please confirm if you want to remove it permanently.</p>
                <form method="post" class="d-flex justify-content-center gap-2">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Delete</button>
                    <a href="{% url 'post_list' %}" class="btn btn-outline-light">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
