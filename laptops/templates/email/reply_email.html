<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            padding: 20px;
        }
        .container {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 20px;
            border-radius: 8px;
        }
        .header {
            background: #2874f0;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            border-radius: 8px 8px 0 0;
        }
        .content {
            padding: 15px;
            color: #333;
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: gray;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        BuyLaptop Support
    </div>

    <div class="content">
        <p>Hello <b>{{ name }}</b>,</p>

        <p>Thank you for contacting us.</p>

        <p>{{ reply }}</p>

        <p>We appreciate your patience.</p>
    </div>

    <div class="footer">
        © 2026 BuyLaptop | Support Team
    </div>

</div>

</body>
</html>
